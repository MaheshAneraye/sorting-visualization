name: Docker Image CI and Deploy

on:
  push:
    branches:
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Update dependencies
    - name: Update dependencies
      run: npm update

    # Audit vulnerabilities (non-blocking)
    - name: Run npm audit
      run: npm audit --audit-level=high || echo "Audit found issues, continuing"

    # Attempt auto-fix
    - name: Run npm audit fix
      run: npm audit fix --force || echo "Auto-fix incomplete"

    # Re-check vulnerabilities
    - name: Run npm audit after fix
      run: npm audit --audit-level=high || echo "Manual fixes may be required"

    # SonarQube Scan (PINNED VERSION)
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Login to Docker Hub
    - name: Log in to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

    # Build Docker image
    - name: Build Docker image
      run: |
        IMAGE_TAG=sorting-${{ github.run_number }}
        docker build . --file Dockerfile --tag $IMAGE_TAG

    # Tag and push image
    - name: Tag and Push Docker image
      run: |
        IMAGE_TAG=sorting-${{ github.run_number }}
        docker tag $IMAGE_TAG ${{ secrets.DOCKER_HUB_USERNAME }}/sorting-${{ github.run_number }}:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/sorting-${{ github.run_number }}:latest

    # ✅ FIXED Trivy (SECURE VERSION)
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: '${{ secrets.DOCKER_HUB_USERNAME }}/sorting-${{ github.run_number }}:latest'
        format: 'table'
        exit-code: '0'   # change to '1' if you want to fail pipeline
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'HIGH,CRITICAL'

    # Setup SSH agent
    - name: Start SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Deploy to Docker Swarm
    - name: Deploy Docker service on Swarm Manager
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SWARM_MANAGER_IP }} \
        "sudo docker service update --image ${{ secrets.DOCKER_HUB_USERNAME }}/sorting-${{ github.run_number }}:latest my-service || \
         sudo docker service create --name my-service --replicas 3 -p 3000:3000 ${{ secrets.DOCKER_HUB_USERNAME }}/sorting-${{ github.run_number }}:latest"

    # Verify service
    - name: Verify Docker service status
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SWARM_MANAGER_IP }} \
        "sudo docker service ls"
